<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KisanMandi Sale Bill</title><link rel="stylesheet" href="style.css"></head><body><div id="bill"></div><script>
const records=JSON.parse(localStorage.getItem('kisan_records')||'[]');
const id=new URLSearchParams(location.search).get('id'); const r=records.find(x=>x.id===id);
const m=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
if(!r){document.getElementById('bill').innerHTML='<div class="print-bill"><h2>Bill not found</h2><p>Please return to KisanMandi and print from a completed sale.</p></div>'}else{
const total=(r.finalPrice||0)*r.quantity;
document.getElementById('bill').innerHTML=`<div class="print-bill"><div class="bill-head"><div><div class="bill-title">KisanMandi AI</div><div style="margin-top:6px">Agricultural Sale & Auction Bill</div></div><div class="bill-meta">Bill No: ${r.id}<br>Generated: ${new Date().toLocaleString('en-IN')}<br>Status: ${r.finalPrice?'COMPLETED':'OPEN'}</div></div><div style="margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:18px"><div><b>Farmer</b><br>${r.farmerName}<br>Farmer ID: ${r.farmerId}</div><div><b>Arrival</b><br>${new Date(r.arrival).toLocaleString('en-IN')}<br>Crop: ${r.crop}</div></div><table class="table bill-table"><thead><tr><th>Description</th><th>Qty</th><th>Quality</th><th>AI Range</th><th>Final / q</th><th>Amount</th></tr></thead><tbody><tr><td>${r.crop}</td><td>${r.quantity} q</td><td>Grade ${r.grade}<br>${r.humidity}% humidity</td><td>${m(r.prediction.low)}–${m(r.prediction.high)}</td><td>${r.finalPrice?m(r.finalPrice):'—'}</td><td>${r.finalPrice?m(total):'—'}</td></tr></tbody></table><div class="bill-total"><div class="box"><div style="display:flex;justify-content:space-between;padding:8px 0"><span>Initial bid</span><b>${m(r.initialBid)}</b></div><div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #ddd;font-size:18px"><span>Total sale value</span><b>${m(total)}</b></div></div></div><div class="sign"><div>Farmer signature / acknowledgement</div><div>Authority / mandi representative</div></div><div class="footer">Indicative AI estimate is an advisory signal, not a guaranteed market quote. Verify final price against the authenticated auction/market record.</div><div class="no-print" style="margin-top:28px;display:flex;gap:10px"><button class="btn btn-primary" onclick="window.print()">Print Bill</button><button class="btn btn-secondary" onclick="window.close()">Close</button></div></div>`;
}
</script></body></html>
